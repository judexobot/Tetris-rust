name: Android Rust APK

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v0.3.0']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install pinned Android components
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Rust tests and visual regressions
        run: |
          cargo test --workspace --locked
          python3 tools/visual_check.py
      - name: Compile ARM64 Rust
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          cargo ndk -t arm64-v8a build -p tetris_nes_core --release --locked
          mkdir -p android/app/src/main/cpp/prebuilt/arm64-v8a
          cp target/aarch64-linux-android/release/libtetris_nes_core.a android/app/src/main/cpp/prebuilt/arm64-v8a/
      - name: Assemble release APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64$STORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]; then
            [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] || { echo 'All four Android signing secrets must be configured.' >&2; exit 1; }
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tetris-release.keystore"
            export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/tetris-release.keystore"
            export RELEASE_STORE_PASSWORD="$STORE_PASSWORD" RELEASE_KEY_ALIAS="$KEY_ALIAS" RELEASE_KEY_PASSWORD="$KEY_PASSWORD"
          else
            echo 'No persistent signing key configured; this APK uses the runner debug key and cannot be relied on for upgrades.'
          fi
          gradle -p android :app:assembleRelease :app:assembleReleaseAndroidTest --no-daemon
      - name: Inspect APK, native exports and signature
        run: tools/tests/verify_apk.sh android/app/build/outputs/apk/release/app-release.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Download the published v0.2.2 APK for diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/baseline
          gh release download v0.2.2 --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir target/baseline
      - name: Launch actual ARM64 release APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: tools/tests/ci_android.sh
      - name: Upload test screenshots and Logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-evidence
          path: |
            target/screenshots/*.png
            target/android-smoke/
            target/android-persistence/
            target/baseline-smoke/
            target/baseline-result.txt
          if-no-files-found: warn
      - name: Stage validated APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TetrisNESRust-v0.3.0-arm64.apk
      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: TetrisNESRust-v0.3.0-arm64
          path: TetrisNESRust-v0.3.0-arm64.apk
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref == 'refs/tags/v0.3.0'
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TetrisNESRust-v0.3.0-arm64
      - name: Create release only after all required checks succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.0 TetrisNESRust-v0.3.0-arm64.apk \
            --verify-tag --title 'Tetris NES Rust v0.3.0 (ARM64)' \
            --notes-file docs/release-notes-v0.3.0.md
